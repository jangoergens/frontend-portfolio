<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Only neutral entry URLs use browser preferences. Localized URLs stay explicit.
			if (location.pathname === "/" || /^\/about\/?$/.test(location.pathname)) {
				let savedLanguage;
				try {
					savedLanguage = localStorage.getItem("language");
				} catch {
					// Browser preferences still work when local storage is disabled.
				}
				const preferredLanguage = (navigator.languages || [navigator.language])
					.map((language) => language.toLowerCase().split("-")[0])
					.find((language) => language === "de" || language === "en");
				const language =
					savedLanguage === "de" || savedLanguage === "en"
						? savedLanguage
						: preferredLanguage || "en";
				const path = location.pathname === "/" ? "" : "/about";
				location.replace(`/${language}${path}${location.search}${location.hash}`);
			}
		</script>
		<script>
			try {
				const theme = localStorage.getItem("theme");
				document.documentElement.classList.toggle(
					"dark",
					theme === "dark" ||
						(theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches),
				);
			} catch {
				document.documentElement.classList.toggle(
					"dark",
					matchMedia("(prefers-color-scheme: dark)").matches,
				);
			}
		</script>
		<link
			as="font"
			crossorigin
			href="/fonts/Inter-Latin-Variable.woff2"
			rel="preload"
			type="font/woff2"
		/>
		<meta name="viewport" content="width=device-width initial-scale=1" />
		%sveltekit.head%
	</head>
	<body>
		<div>%sveltekit.body%</div>
	</body>
</html>
