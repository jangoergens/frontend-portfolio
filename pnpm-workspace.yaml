packages:
  - "apps/*"

engineStrict: true
saveExact: true

# Permit installation scripts only for the native tooling used by this workspace.
allowBuilds:
  "@tailwindcss/oxide": true
  "esbuild": true
# Keep pnpm 12's one-day release delay, including frozen installs.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# ESLint 10.12.0 clears the delay on 2026-10-03 at 20:09 UTC.
# Remove this exact-version exception on or after 2026-10-04.
minimumReleaseAgeExclude:
  - eslint@10.12.0
